<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your Lark account</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#f4f4f5;padding:48px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:480px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);">

          <!-- Header -->
          <tr>
            <td style="background:#080c14;padding:28px 40px;">
              <span style="font-family:'Courier New',Courier,monospace;font-size:20px;font-weight:700;color:#22c55e;letter-spacing:0.15em;">LARK</span>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:40px 40px 32px;">
              <h1 style="margin:0 0 10px;font-size:22px;font-weight:700;color:#09090b;line-height:1.3;">Confirm your email</h1>
              <p style="margin:0 0 28px;font-size:15px;line-height:1.6;color:#52525b;">One click and you're in. Confirm your email address to start playing.</p>
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block;background:#22c55e;color:#ffffff;text-decoration:none;font-family:'Courier New',Courier,monospace;font-size:13px;font-weight:700;letter-spacing:0.08em;padding:14px 28px;border-radius:8px;">
                CONFIRM EMAIL
              </a>
              <p style="margin:28px 0 0;font-size:13px;line-height:1.6;color:#a1a1aa;">
                Didn't create a Lark account? You can safely ignore this email.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 40px 28px;border-top:1px solid #f4f4f5;">
              <p style="margin:0;font-size:12px;color:#a1a1aa;">
                <a href="https://lark.coach" style="color:#a1a1aa;text-decoration:none;">lark.coach</a>
                &nbsp;&mdash;&nbsp;The guitar tutor that listens.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
