<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lark -- Offline</title>
  <style>
    :root { --bg: #080c14; --text: #e2e8d0; --text3: #64748b; --accent: #22c55e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 360px;
    }
    .eyebrow {
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: var(--text3);
      line-height: 1.7;
      margin-bottom: 28px;
    }
    button {
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: var(--accent);
      color: #080c14;
      border: none;
      border-radius: 99px;
      padding: 12px 28px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">No Connection</p>
    <h1>You're offline</h1>
    <p>Lark needs a connection to listen to your playing. Connect to the internet and try again.</p>
    <button onclick="window.location.reload()">TRY AGAIN</button>
  </div>
</body>
</html>
